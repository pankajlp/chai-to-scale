<title>Chai to Scale</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800;125,900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: an Indian railway line. Each level is a station with a yellow platform board,
   and live simulators use signal lights (green, yellow, red) to show system health. */
:root{
  --paper:#F1F4F3;--card:#FFFFFF;--sunk:#E6EBEA;--ink:#15191C;--mute:#55606A;--line:#D2D9DA;
  --sign:#FFCC00;--signink:#15191C;--rail:#1B4DB1;--railsoft:#E3EAF9;
  --go:#117A3B;--gosoft:#DDF2E5;--wait:#A86F00;--waitsoft:#FBF0D2;--stop:#C9281D;--stopsoft:#FBE3E1;
  --bar:#15191C;
  --display:"Archivo","Arial Black",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101518;--card:#192024;--sunk:#222B30;--ink:#EEF2F1;--mute:#A0ACB3;--line:#313C42;
  --rail:#8DB0F7;--railsoft:#1F2C47;
  --go:#46C983;--gosoft:#15331F;--wait:#F2B83A;--waitsoft:#3A2E10;--stop:#F47468;--stopsoft:#401B18;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101518;--card:#192024;--sunk:#222B30;--ink:#EEF2F1;--mute:#A0ACB3;--line:#313C42;
  --rail:#8DB0F7;--railsoft:#1F2C47;
  --go:#46C983;--gosoft:#15331F;--wait:#F2B83A;--waitsoft:#3A2E10;--stop:#F47468;--stopsoft:#401B18;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3{font-family:var(--display);font-stretch:125%;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5.2vw,44px);font-weight:900}
h2{font-size:clamp(21px,3.2vw,27px);font-weight:800}
h3{font-size:17px;font-weight:800}
p{margin:0}
a{color:var(--rail)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rail);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.read{max-width:760px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:22px}
.label{font:700 12px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bar);color:#fff}
.top .wrap{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding-block:8px}
.brand{all:unset;cursor:pointer;background:var(--sign);color:var(--signink);font:900 15px/1 var(--display);font-stretch:125%;padding:8px 10px;border:2px solid var(--signink);box-shadow:0 0 0 2px var(--sign);letter-spacing:.02em}
.brand:focus-visible{outline:3px solid #fff}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav button{all:unset;cursor:pointer;padding:7px 10px;font-weight:700;font-size:15px;color:#C9D2D6;border-bottom:3px solid transparent}
.nav button:hover{color:#fff}
.nav button[aria-current="page"]{color:#fff;border-bottom-color:var(--sign)}
.nav button:focus-visible{outline:2px solid #fff}
.score{display:flex;gap:10px;align-items:center;font:700 13px var(--mono);color:#fff;white-space:nowrap}
.score b{color:var(--sign)}

/* boards */
.board{background:var(--sign);color:var(--signink);border:3px solid var(--signink);outline:3px solid var(--sign);padding:14px 18px;margin:3px}
.board .label{color:var(--signink);opacity:.72}
.board h1,.board h2{color:var(--signink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;padding-block:28px 12px;align-items:start}
.hero>*{min-width:0}
.hero .lead{font-size:19px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;padding:11px 18px;background:var(--ink);color:var(--paper);border:2px solid var(--ink);text-align:center}
.btn:hover{background:var(--rail);border-color:var(--rail);color:var(--card)}
.btn:focus-visible{outline:3px solid var(--rail);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink);border-color:var(--ink)}
.btn.small{padding:6px 12px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* journey line */
.line{position:relative;padding-left:44px;display:flex;flex-direction:column;gap:30px;padding-block:18px 40px}
.line::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:14px;background:
  repeating-linear-gradient(180deg,var(--mute) 0 4px,transparent 4px 13px)}
.line::after{content:"";position:absolute;left:14px;top:0;bottom:0;width:8px;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
.stn{position:relative;display:flex;flex-direction:column;gap:12px}
.stn::before{content:"";position:absolute;z-index:1;left:-41px;top:18px;width:22px;height:22px;border-radius:50%;background:var(--sign);border:4px solid var(--ink)}
.stn.full::before{background:var(--go)}
.stn .board{align-self:flex-start;max-width:100%}
.stn .blurb{color:var(--mute);max-width:62ch}
.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
.lessons button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:9px 4px;border-bottom:1px solid var(--line);min-width:0}
.lessons button:hover{background:var(--sunk)}
.lessons button:focus-visible{outline:3px solid var(--rail)}
.lessons .tick{flex:none;font:700 12px var(--mono);width:26px;color:var(--mute)}
.lessons .done .tick,.lessons button.done .tick{color:var(--go)}
.lessons .name{font-weight:700}
.lessons .sub{display:block;font-weight:400;font-size:15px;color:var(--mute)}

/* lesson */
.crumb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-block:18px 8px}
.linkish{all:unset;cursor:pointer;color:var(--rail);font-weight:700;text-decoration:underline}
.linkish:focus-visible{outline:3px solid var(--rail)}
.block{display:flex;flex-direction:column;gap:8px}
.bigtext{font-size:20px;line-height:1.5}
.idea{font-size:20px;font-weight:700;line-height:1.4}
.realgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.real{background:var(--card);border:1px solid var(--line);padding:12px 14px;min-width:0}
.real b{display:block;font-family:var(--display);font-stretch:125%;font-size:15px;margin-bottom:2px}
.cost{background:var(--waitsoft);padding:14px 16px;border-left:6px solid var(--wait)}
.words{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);border-top:1px solid var(--line)}
.words dt,.words dd{margin:0;padding:8px 4px;border-bottom:1px solid var(--line)}
.words dt{font-weight:700}
details.deep{background:var(--railsoft);padding:12px 16px}
details.deep summary{cursor:pointer;font-weight:700;color:var(--rail)}
details.deep p{margin-top:8px}
.prose p+p{margin-top:10px}

/* sim */
.sim{background:var(--card);border:2px solid var(--ink);min-width:0}
.sim canvas{display:block;width:100%;background:var(--card)}
.simhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.signal{display:flex;gap:4px;background:var(--signink);padding:4px 6px;border-radius:12px}
.signal i{width:12px;height:12px;border-radius:50%;background:#3b4246;display:block}
.signal[data-s="go"] i:nth-child(1){background:#35D07F;box-shadow:0 0 7px #35D07F}
.signal[data-s="wait"] i:nth-child(2){background:#FFCC00;box-shadow:0 0 7px #FFCC00}
.signal[data-s="stop"] i:nth-child(3){background:#FF5A4D;box-shadow:0 0 7px #FF5A4D}
.stat{font:700 15px var(--mono);white-space:nowrap}
.stat small{display:block;font:400 12px var(--body);color:var(--mute)}
.simhead .spacer{flex:1}
.simsay{padding:9px 12px;background:var(--sunk);font-weight:700;min-height:42px}
.ctrls{display:flex;flex-direction:column;gap:10px;padding:12px;border-top:1px solid var(--line)}
.ctl{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:10px;align-items:center}
.ctl output{font:700 14px var(--mono);min-width:64px;text-align:right}
.ctl input[type=range]{width:100%;accent-color:var(--rail);min-height:28px}
.ctlbtns{display:flex;flex-wrap:wrap;gap:8px}
.tog{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:2px solid var(--ink);font-weight:700;font-size:15px}
.tog::before{content:"";width:14px;height:14px;border:2px solid var(--ink);background:transparent}
.tog[aria-pressed="true"]{background:var(--sign);color:var(--signink);border-color:var(--signink)}
.tog[aria-pressed="true"]::before{background:var(--signink);border-color:var(--signink)}
.tog:focus-visible{outline:3px solid var(--rail);outline-offset:2px}
.act{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 12px;font-weight:700;font-size:15px;background:var(--stopsoft);color:var(--stop);border:2px solid var(--stop)}
.act:hover{background:var(--stop);color:var(--card)}
.act:focus-visible{outline:3px solid var(--rail);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:0}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 12px;border:2px solid var(--ink);margin-right:-2px;font-weight:700;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:3px solid var(--rail);outline-offset:2px;position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--mute);padding:6px 12px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.simtry{font-size:17px}
.simtry b{color:var(--rail)}

/* visuals */
.vis{background:var(--card);border:2px solid var(--ink);padding:14px;min-width:0;overflow-x:auto}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.two>*{min-width:0}
.tbl{border-collapse:collapse;width:100%;font-size:15px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-weight:700}
pre.code{margin:0;font:500 14px/1.5 var(--mono);background:var(--sunk);padding:10px 12px;overflow-x:auto}
.steps{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.stepbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;width:100%;padding:9px 10px;border:1px solid var(--line);background:var(--card)}
.stepbtn:hover{background:var(--sunk)}
.stepbtn[aria-pressed="true"]{background:var(--sign);color:var(--signink);border-color:var(--signink)}
.stepbtn:focus-visible{outline:3px solid var(--rail)}
.stepbtn .n{font:700 14px var(--mono);flex:none;width:20px}
.txnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-block:10px}
.acct{border:2px solid var(--line);padding:10px 12px}
.acct b{display:block;font:700 22px var(--mono)}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;border-bottom:2px solid var(--ink)}
.bars i{flex:1;background:var(--rail);display:block;min-width:0}
.bars i.slow{background:var(--stop)}

/* quiz */
.q{background:var(--card);border:2px solid var(--ink);padding:14px;display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:9px 12px;border:1px solid var(--line)}
.opt:hover{background:var(--sunk)}
.opt:focus-visible{outline:3px solid var(--rail)}
.opt.right{background:var(--gosoft);border-color:var(--go);font-weight:700}
.opt.wrong{background:var(--stopsoft);border-color:var(--stop)}
.why{font-size:16px}
.ask{background:var(--sunk);padding:14px;display:flex;flex-direction:column;gap:10px}
.ask input{width:100%;padding:9px 11px;border:2px solid var(--ink);background:var(--card)}
.ask .ans{white-space:pre-wrap}
.next{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding-block:10px 40px}

/* cards, lists */
.casegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.casecard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:2px solid var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.casecard:hover{background:var(--sunk)}
.casecard:focus-visible{outline:3px solid var(--rail);outline-offset:2px}
.casecard .sub{color:var(--mute)}
.pill{display:inline-block;font:700 12px var(--mono);padding:2px 7px;background:var(--railsoft);color:var(--rail);align-self:flex-start}
.pill.ok{background:var(--gosoft);color:var(--go)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nums div{border-top:4px solid var(--ink);padding-top:6px;min-width:0}
.nums b{display:block;font:700 19px var(--mono)}
.fix{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border:1px solid var(--line);background:var(--card)}
.fix>div{padding:10px 12px;min-width:0}
.fix>div:first-child{border-right:1px solid var(--line)}
.fixes{display:flex;flex-direction:column;gap:8px}
.casewide{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
.casewide>*{min-width:0}
.search{width:100%;padding:11px 12px;border:2px solid var(--ink);background:var(--card)}
.term{padding:10px 2px;border-bottom:1px solid var(--line)}
.term b{font-size:18px}
.term .also{font-size:15px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 11px;border:1px solid var(--ink);font-size:15px}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible{outline:3px solid var(--rail);outline-offset:2px}
.labgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.labgrid>*{min-width:0}
.mission{background:var(--card);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mission.on{border:2px solid var(--ink)}
.verdict{padding:12px 14px;font-weight:700}
.verdict.ok{background:var(--gosoft);color:var(--go)}
.verdict.no{background:var(--stopsoft);color:var(--stop)}
.toast{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--sign);color:var(--signink);border:2px solid var(--signink);font-weight:700;padding:10px 14px;transition:transform .2s}
.toast[hidden]{display:none}
footer{color:var(--mute);font-size:15px;padding-block:20px 40px}
@media (max-width:820px){
  .top .wrap{justify-content:space-between}
  .nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}
  .hero,.labgrid,.casewide{grid-template-columns:minmax(0,1fr)}
  .realgrid,.lessons{grid-template-columns:minmax(0,1fr)}
  .casegrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  body{font-size:16px}
  .ctl{grid-template-columns:minmax(0,1fr) auto}
  .ctl input{grid-column:1/-1;grid-row:2}
  .two,.fix{grid-template-columns:minmax(0,1fr)}
  .fix>div:first-child{border-right:0;border-bottom:1px solid var(--line)}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .line{padding-left:34px}
  .line::before{left:3px}.line::after{left:6px}
  .stn::before{left:-40px}
  .words{grid-template-columns:minmax(0,1fr)}
  .words dt{border-bottom:0;padding-bottom:0}
  .bigtext,.idea{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<header class="top"><div class="wrap">
  <button class="brand" id="brand">CHAI TO SCALE</button>
  <nav class="nav" id="nav" aria-label="Main">
    <button data-go="home">Journey</button>
    <button data-go="lab">Build Lab</button>
    <button data-go="cases">Real Apps</button>
    <button data-go="words">Fix-it &amp; Words</button>
  </nav>
  <div class="score" id="score" aria-label="Your progress"></div>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* Sim engine: dots are requests that travel between nodes, wait in queues and get served. */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LIVE = new Set();
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

class Sim {
  constructor(cfg, host) {
    this.cfg = cfg; this.host = host || null;
    this.t = 0; this.acc = 0; this.ps = []; this.log = []; this.rate = cfg.rate ?? 1;
    this.bgDone = 0; this.blocked = 0; this.total = { ok: 0, lost: 0, ms: 0 }; this.data = {};
    this.patience = cfg.patience ?? 7000; this.playing = !REDUCED; this.visible = false;
    this.nodes = {}; this.edges = [];
    this.setGraph(cfg.nodes, cfg.edges || []);
    if (cfg.init) cfg.init(this);
    if (host) this.mount();
    (cfg.controls || []).forEach(c => { if (c.set && c.val !== undefined) c.set(this, c.val); });
  }
  setGraph(nodes, edges) {
    const old = this.nodes; this.nodes = {};
    for (const id in nodes) {
      const prev = old[id], n = nodes[id];
      this.nodes[id] = Object.assign({ id, workers: 1, ms: 0, queue: 0, busy: 0, q: [], down: false, off: false, hl: false }, n,
        prev ? { busy: prev.busy, q: prev.q, down: prev.down } : {});
    }
    this.edges = edges;
  }
  n(id) { return this.nodes[id]; }
  alive(ids) { return ids.filter(i => { const n = this.nodes[i]; return n && !n.down && !n.off; }); }
  spawn(tag) {
    const from = (tag && tag.from) || this.cfg.origin || 'c', o = this.nodes[from];
    const p = { at: from, from, path: [from], state: 'idle', born: this.t, tag: tag || {}, bg: false, k: 0, x: o.x, y: o.y };
    this.ps.push(p); this.forward(p); return p;
  }
  forward(p) {
    const next = this.cfg.route(p, p.at, this);
    if (p.state === 'lost') return;
    if (next === null || next === undefined) { this.finish(p); return; }
    if (Array.isArray(next)) {
      next.forEach(id => { const c = Object.assign({}, p, { path: p.path.slice(), tag: Object.assign({}, p.tag), bg: true }); this.ps.push(c); this.go(c, id); });
      p.state = 'gone'; return;
    }
    this.go(p, next);
  }
  go(p, id) {
    const a = this.nodes[p.at], b = this.nodes[id];
    p.to = id; p.k = 0; p.state = 'move'; p.dur = b.hop ?? this.cfg.hop ?? 320; p.ax = a.x; p.ay = a.y; p.bx = b.x; p.by = b.y;
  }
  arrive(p) {
    const n = this.nodes[p.to]; p.at = p.to; p.path.push(p.at); p.x = n.x; p.y = n.y;
    if (n.down || n.off) { this.lose(p); return; }
    if (n.gate && !n.gate(p, this)) { this.block(p); return; }
    if (n.ack && !p.bg) this.ack(p);
    if (!n.ms) { this.forward(p); return; }
    if (n.busy < n.workers) this.begin(p, n);
    else if (n.q.length < n.queue) { n.q.push(p); p.state = 'wait'; p.qt = this.t; }
    else this.lose(p);
  }
  begin(p, n) { n.busy++; p.state = 'work'; p.until = this.t + n.ms * rnd(.75, 1.25); p.node = n; }
  ack(p) {
    const c = Object.assign({}, p, { path: p.path.slice(), tag: Object.assign({}, p.tag) }); this.ps.push(c); this.finish(c); p.bg = true;
  }
  finish(p) {
    if (p.bg) { this.bgDone++; if (this.cfg.onBgDone) this.cfg.onBgDone(p, this); p.state = 'gone'; return; }

    rate: 1.2, h: 240, hop: 400, okMs: 3000, okWord: 'Paid', lostWord: 'No reply', nodes: { c: { kind: 'client', label: 'You', x: 0, y: .5 }, a: { label: 'Payment app', x: .5, y: .5, ms: 200, workers: 4, queue: 8 }, b: { kind: 'db', label: 'Bank', sub: 'moves money', x: 1, y: .5, ms: 200, workers: 4, queue: 8 } },
    edges: [['c', 'a'], ['a', 'b']], init: s => { Object.assign(s.data, { retry: false, key: false, double: 0, id: 0, seen: new Set() }); },
    tag: s => ({ id: ++s.data.id }),
    route: (p, at, s) => {
      if (at === 'c') return 'a'; if (at === 'a') return 'b';
      const dup = s.data.seen.has(p.tag.id);
      if (!dup) s.data.seen.add(p.tag.id); else if (!s.data.key) s.data.double++;
      if (Math.random() < .35 && !p.tag.tried) { s.lose(p); if (s.data.retry) { const t = { ...p.tag, tried: true }; setTimeout(() => s.spawn(t), 300); } return undefined; }
      return null;
    },
    controls: [{ k: 'toggle', label: 'Retry when no reply', val: false, set: (s, v) => s.data.retry = v }, { k: 'toggle', label: 'Attach a unique payment ID', val: false, set: (s, v) => s.data.key = v }],
    say: s => `Charged twice: ${s.data.double} times. ${s.data.retry && !s.data.key ? 'Retrying without an ID charges people twice!' : s.data.retry ? 'The bank sees the ID and ignores repeats. Safe.' : 'One in three replies goes missing and nobody tries again.'}`
  }),
  breaker: () => ({
    rate: 3, h: 250, nw: 88, okMs: 2500, legend: '<span><i style="background:var(--wait)"></i>Quick "try later" reply</span>',
    nodes: { c: { ...C0, x: 0, y: .5 }, s: { label: 'Your app', sub: '6 workers', x: .45, y: .5, ms: 200, workers: 6, queue: 8 }, x: { label: 'SMS partner', sub: 'outside company', x: 1, y: .5, ms: 150, workers: 20, queue: 0 } },
    edges: [['c', 's'], ['s', 'x']], init: s => { s.data.brk = false; s.data.bad = false; },
    tick: s => { s.n('s').ms = s.data.bad && !s.data.brk ? 5000 : 200; s.n('x').label = s.data.bad ? 'Hanging' : 'SMS partner'; },
    route: (p, at, s) => at === 'c' ? 's' : at === 's' ? ((s.data.bad && s.data.brk) ? (p.flag = true, null) : 'x') : null,
    controls: [rateCtl(3, 8, 'Requests per second'), { k: 'btn', label: 'Partner stops answering', do: s => s.data.bad = !s.data.bad }, { k: 'toggle', label: 'Circuit breaker', val: false, set: (s, v) => s.data.brk = v }],
    say: s => !s.data.bad ? 'All good. Press the button to make the partner hang.' : s.data.brk ? 'Breaker tripped. The app stops calling the partner and answers instantly.' : 'Every worker is stuck waiting on the partner, so your whole app freezes.'
  }),
};

{ id: 'basics', name: 'Chai Stall Junction', size: '1 stall, 50 customers a day', blurb: 'You open a small chai stall. Every big app in the world starts with the same few parts as your stall.', lessons: [

 { id: 'client', t: 'Client and server', sub: 'The one who asks, the one who answers', p: 'A customer shouts "one chai!" and you make it. The customer never enters your kitchen. The customer only asks. You do the work and hand it over.',
   i: 'The client asks. The server answers. Your phone is a client. A computer that runs all day somewhere else is the server.', sim: 'clientserver', try: 'Press <b>Send one request</b>. Follow the blue dot in and the green dot back. That round trip happens each time you open an app.',

   cost: 'If the server is off, every client is stuck. Everything now depends on that one place.',

 { id: 'dns', t: 'How your phone finds a website', sub: 'DNS, the internet phonebook', p: 'You want to call a friend. You remember the name, not the number, so you open Contacts. Computers have the same problem: people type google.com, but computers only reach numbers.',
   i: 'DNS is the phonebook of the internet. It turns a name like google.com into a number the computer can reach.', sim: 'dns', try: 'Watch the dots stop at the phonebook first. Turn on <b>Phone remembers the address</b> and see the faster direct path.',

   cost: 'Remembered numbers can go out of date. If a website moves, some people reach the old address for a while.',
   words: [['DNS', 'Domain Name System. The phonebook of the internet.'], ['Domain', 'A website name such as irctc.co.in.'], ['IP address', 'The number of a computer on the internet.']],
   deep: 'Answers are saved for a set time called TTL (time to live). Browsers, phones and internet providers all keep copies. Big sites return different numbers depending on where you are, so DNS also helps send you to a nearby server.',

 { id: 'latency', t: 'Latency and throughput', sub: 'How fast, and how many', p: 'A customer asks: how long for one cup? Your landlord asks: how many cups in a day? Those are two different questions, and you can be good at one and bad at the other.',
   i: 'Latency is how long one customer waits. Throughput is how many customers you serve per second. A faster worker cuts latency. More workers raise throughput.', sim: 'lat', try: 'Change <b>Time for one cup</b> and <b>Helpers</b>. Read the bar under the picture to see which number moves.',

 { id: 'database', t: 'The database', sub: 'A notebook that never forgets', p: 'You keep credit accounts in your head. Raju owes ₹40, Meena owes ₹25. Then you get a fever for a week and forget everything. Your money is gone.',
   i: 'A database stores information safely so it survives when the server restarts. Servers can forget. The database must not.', sim: 'db', try: 'Turn off the notebook, let orders build up, then press <b>Power cut</b>. Now turn the notebook on and try the same thing.',

]},

 { id: 'loadbalancer', t: 'Load balancer', sub: 'The manager at the gate', p: 'You have three stalls, but customers all crowd stall 1 because it is nearest. Stalls 2 and 3 sit empty. You put a manager at the entrance to point each person to a stall.',

 { id: 'stateless', t: 'Stateless servers', sub: 'Any stall can serve anyone', p: 'At stall 1 you give credit to regulars and remember them. Today the manager sends a regular to stall 2. Stall 2 says: "Who are you? Pay cash." The customer leaves angry.',

{ id: 'speed', name: 'Express Lane', size: '20 shops, 1 lakh customers a day', blurb: 'People hate waiting. A delay of a few seconds loses them. Here is how to answer faster without doing more work.', lessons: [
 { id: 'cache', t: 'Caching', sub: 'Keep a flask of ready chai', p: 'Most customers order the same plain chai, and each cup takes 3 minutes. So you brew a big flask in advance and pour it in 5 seconds.',
   i: 'A cache keeps popular answers ready in fast memory, so you do not repeat slow work.', sim: 'cache', try: 'Turn the <b>Cache off</b> and raise traffic to 8. Turn it back on and move the percentage. Watch the database calm down.',
   real: [['Top of your desk', 'You keep the files you use often close to you.'], ['YouTube', 'Popular videos are kept ready near viewers.'], ['Browser', 'Logos are saved on your phone, so pages open faster the second time.']],
   cost: 'A cache can hold old information, and it uses costly memory, so you can keep only the popular things.',
   words: [['Cache', 'Fast storage for popular answers.'], ['Cache hit', 'Found in the cache. Fast.'], ['Cache miss', 'Not found. Go to the slow place.'], ['Redis', 'A popular cache tool.']],
   deep: 'When the cache is full, something must go. LRU (least recently used) throws out what nobody has touched for longest. The most common pattern is cache-aside: check the cache, on a miss read the database, then save the answer in the cache.',
   quiz: [['A cache hit means:', ['The answer was already ready', 'The server crashed', 'A user was blocked', 'The disk is full'], 0, 'No slow work was needed.'], ['What should you cache?', ['Things many people read often', 'Your bank balance during a payment', 'One-time passwords', 'Everything forever'], 0, 'Popular, read-often data gets the biggest benefit.']] },
 { id: 'stale', t: 'Stale data', sub: 'When the price card is wrong', p: 'Milk prices rise, so you raise chai from ₹10 to ₹15. But the printed price card at the counter still says ₹10. Customers argue.',
   i: 'A cache copy can go out of date. You need a rule for when to throw it out.', sim: 'stale', try: 'Press <b>Raise the price</b> and count wrong answers. Reduce the expiry time. Then turn on <b>Fix the card on every change</b>.',

   deep: 'Phil Karlton\'s old joke says the two hard things in computer science are naming things and cache invalidation. Another trap is the cache stampede: a popular item expires and thousands of requests hit the database at once.',
   quiz: [['A shorter TTL means:', ['Fresher data, more database work', 'Older data, less work', 'No change', 'No cache needed'], 0, 'Copies expire sooner, so you fetch more often.'], ['Which needs the freshest data?', ['Your bank balance', 'A profile photo', 'A company logo', 'An old news article'], 0, 'Wrong money figures do real harm.']] },
 { id: 'cdn', t: 'CDN', sub: 'A copy near every customer', p: 'Your famous masala mix is made only in Mumbai. Customers in Guwahati wait 5 days. So you keep stock in a small warehouse in each city.',
   i: 'A CDN keeps copies of photos and videos in many cities, so each user downloads from somewhere nearby.', sim: 'cdn', try: 'See how far the dots must travel to Mumbai. Turn on the <b>CDN</b>.',
   real: [['Local warehouses', 'Amazon delivers next day because stock sits nearby.'], ['Netflix', 'Places its own boxes inside internet providers.'], ['Hotstar', 'Live match video comes from servers near you.']],

   words: [['CDN', 'Content Delivery Network. Servers placed around the world.'], ['Edge server', 'A CDN server near users.'], ['Origin', 'The main server with the original file.'], ['Static content', 'Files that are the same for everyone: photos, videos.']],

 { id: 'index', t: 'Database index', sub: 'The page at the back of the book', p: 'Your register has 10 lakh customers. To find "Meena Kumari", you start at page 1 and read every line. Each search takes ages.',

   real: [['Dictionary', 'Sorted words let you jump to a page.'], ['Phone contacts', 'Typing a letter finds a name instantly.'], ['Train PNR', 'The number finds your ticket at once among millions.']],

   deep: 'Sorted data needs about 20 steps to find one item among a million, because each step cuts the options in half. That is why adding the right index can make a query 1,000 times faster with one line of work.',

]},
{ id: 'data', name: 'Record Room', size: '100 outlets, 10 lakh customers', blurb: 'One notebook can no longer hold everything. Data must be split, copied and kept correct.', lessons: [
 { id: 'sqlnosql', t: 'SQL and NoSQL', sub: 'Neat registers or flexible folders', p: 'Your accounts fit neat columns: name, date, amount. But customer feedback is messy. Some have photos, some have voice notes. One kind of notebook does not suit both.',
   i: 'SQL databases store neat tables with strict rules. NoSQL databases store flexible records and spread across many machines more easily.', vis: 'sql', real: [['Bank ledger (SQL)', 'Strict columns. Every rupee must match.'], ['Instagram profile (NoSQL)', 'Each person fills different things.'], ['WhatsApp messages (NoSQL)', 'Enormous volume, simple lookups.']],
   cost: 'SQL gives strong rules and joins, but is harder to spread across machines. NoSQL spreads easily, but you give up some checks and flexible questions.',
   words: [['SQL', 'Language for asking questions of tables. Used by MySQL and PostgreSQL.'], ['NoSQL', 'Databases that are not tables, such as MongoDB and Cassandra.'], ['Schema', 'The fixed plan of columns.'], ['Join', 'Combining two tables to answer a question.']],
   deep: 'NoSQL has four families: key-value (Redis), document (MongoDB), wide-column (Cassandra) and graph (Neo4j). Today the line is blurry: PostgreSQL stores JSON, and many NoSQL systems offer transactions. Default to SQL unless you have a clear reason.',
   quiz: [['Best for money and bank records?', ['SQL', 'A text file', 'A sticky note', 'A CDN'], 0, 'Strict rules protect money.'], ['Why pick NoSQL?', ['Huge scale and flexible data', 'It is always better', 'It needs no computers', 'For strict accounting'], 0, 'It trades strict rules for easy spreading.']] },
 { id: 'replication', t: 'Replication', sub: 'Keep copies of the notebook', p: 'All staff keep asking to read the one notebook, so a line forms. If it falls in a puddle, your business is gone. So you make copies.',
   i: 'Replication keeps copies of the database on several machines. One copy takes the changes, and the others help with reading and act as a backup.', sim: 'replica', try: 'Push traffic to 12. Add read copies. Then press <b>Main copy fails</b>.',
   real: [['Google Drive', 'Your files live in many data centres.'], ['Photocopied notes', 'One student writes, everyone reads a copy.'], ['UPI banks', 'Records are copied to another city in case of a disaster.']],
   cost: 'Copies take time to update. Right after you post, your friend may not see it for a moment. That gap is called replication lag.',
   words: [['Replica', 'A copy of a database.'], ['Primary', 'The main copy, which accepts changes.'], ['Replication lag', 'Delay before copies catch up.'], ['Failover', 'Making a copy the new main one when the old one dies.']],
   deep: 'Synchronous replication waits for copies before saying "done". This is safe but slower. Asynchronous replication says "done" first. It is fast, but you can lose the latest writes in a crash. Many systems wait for one copy and let the rest catch up.',
   quiz: [['Replicas help most with:', ['Lots of reading', 'Lots of writing', 'Faster typing', 'Smaller files'], 0, 'Reads can go to any copy, but writes must reach all of them.'], ['Replication lag means:', ['Copies are briefly behind', 'The screen is broken', 'A server is on fire', 'Your password expired'], 0, 'Updates take time to reach copies.']] },
 { id: 'sharding', t: 'Sharding', sub: 'Split the register A to M, N to Z', p: 'The notebook is so thick that it will not fit on one shelf. Copies do not help, because each copy is just as thick. So you split it: A to M in one book, N to Z in another.',
   i: 'Sharding cuts data into pieces and stores each piece on a different database. Each piece is a shard.', sim: 'shard', try: 'Set traffic to 18 and add shards. Then turn on <b>Celebrity on Shard 1</b>.',
   real: [['Exam halls', 'Roll numbers 1 to 100 in Hall A, the rest in Hall B.'], ['Train coaches', 'Your seat depends on your coach.'], ['WhatsApp', 'Users are split across many database groups.']],
   cost: 'Questions across shards become slow, moving data later is painful, and one busy shard can hurt everyone on it.',
   words: [['Shard', 'One piece of split data.'], ['Shard key', 'The field that decides where data goes, such as user ID.'], ['Hot shard', 'A shard getting far too much traffic.'], ['Consistent hashing', 'A method to add shards while moving little data.']],
   deep: 'Do not shard early. It adds lasting complexity. First try indexes, caches, read copies and a bigger machine. If you must, use consistent hashing: machines sit on a ring, and adding one only moves a small slice of keys.',
   quiz: [['Replication copies data. Sharding:', ['Splits data', 'Deletes data', 'Colours data', 'Compresses photos'], 0, 'Each shard holds different data.'], ['A hot shard is:', ['One piece getting too much traffic', 'A broken cooler', 'A fast disk', 'A new shard'], 0, 'Often caused by a poor shard key or a celebrity.']] },
 { id: 'cap', t: 'The CAP choice', sub: 'When two branches cannot talk', p: 'Your branches in Patna and Pune share stock by phone. The line goes dead. One samosa is left. Both branches get a customer. Do you sell? Or refuse until the line returns?',
   i: 'When parts of a system lose contact, you must choose: stay open and risk wrong answers, or refuse and stay correct. You cannot have both.', sim: 'cap', try: 'Press <b>Cut the phone line</b>. Switch between <b>Stay open</b> and <b>Refuse orders</b>.',
   real: [['ATM withdrawal', 'Correctness comes first, so an offline ATM refuses.'], ['Instagram likes', 'The count can be off for a moment, and nobody is hurt.'], ['IRCTC seat', 'Two people must never get one seat. It prefers correctness.']],
   cost: 'Choose by asking: which hurts more, a wrong answer or no answer?',
   words: [['Consistency', 'Everyone sees the same correct data.'], ['Availability', 'You always get some answer.'], ['Partition', 'Parts of the system cannot reach each other.'], ['Eventual consistency', 'Copies will agree soon, not instantly.']],
   deep: 'CAP stands for Consistency, Availability, Partition tolerance. Networks do fail, so P is not optional: the real choice during a break is C or A. PACELC adds the everyday trade-off: even without a break, you trade delay against consistency.',
   quiz: [['Bank transfers should choose:', ['Correctness', 'Always answer, even if wrong', 'Random', 'Neither'], 0, 'A wrong balance is worse than a short wait.'], ['A social media like count should choose:', ['Staying available', 'Refusing users', 'Stopping the app', 'Deleting likes'], 0, 'A slightly wrong count hurts nobody.']] },
 { id: 'transactions', t: 'Transactions', sub: 'All or nothing', p: 'You send ₹500 to a friend. The bank takes it from you, then the power fails before adding it to your friend. The money has vanished.',
   i: 'A transaction groups steps into one unit: either every step happens, or none of them do.', vis: 'txn', real: [['UPI payment', 'Money leaves and arrives as one unit, or it is reversed.'], ['Ticket booking', 'Seat and payment succeed together.'], ['Shop exchange', 'You hand over cash only as you get the item.']],
   cost: 'Locks make others wait. Across many machines, transactions become much slower and harder.',
   words: [['Transaction', 'Steps treated as one action.'], ['Commit', 'Save everything for good.'], ['Rollback', 'Undo everything.'], ['ACID', 'The four promises of a reliable transaction.']],
   deep: 'ACID: Atomic (all or nothing), Consistent (rules stay true), Isolated (others do not see half-done work), Durable (saved work survives crashes). Across services, teams use the Saga pattern: a chain of small steps, each with an undo step.',
   quiz: [['If step 2 fails in a transaction:', ['Step 1 is undone', 'Step 1 stays', 'The bank closes', 'Nothing can be done'], 0, 'All or nothing.'], ['"Commit" means:', ['Save for good', 'Delete', 'Copy', 'Log out'], 0, 'Every change becomes permanent.']] },
]},
{ id: 'kitchen', name: 'Busy Kitchen', size: '500 outlets, online orders', blurb: 'Now you run an online business. Too many jobs are tangled together. Time to split the work.', lessons: [
 { id: 'queue', t: 'Message queues', sub: 'Take a token and sit down', p: 'At a busy restaurant, what if each customer stood at the counter until the food was ready? No one else could order. So the counter gives a token, and you sit down.',
   i: 'A queue lets one part leave a job and move on. Another part picks up jobs at its own speed. Nobody stands waiting.', sim: 'queue', try: 'Set customers to 5 with the queue off. Then turn on the <b>queue</b>. Replies become quick, and the kitchen works through the pile.',
   real: [['Food court tokens', 'Order, get a token, wait on a chair.'], ['Sending email', 'You press Send and it goes later.'], ['YouTube upload', 'You get "processing" while the video is prepared in the background.']],

   words: [['Queue', 'A waiting line for jobs.'], ['Producer', 'The one adding jobs.'], ['Consumer', 'The one doing jobs.'], ['Asynchronous', 'Do not wait for the result.'], ['Kafka, RabbitMQ', 'Popular queue tools.']],
   deep: 'Queues absorb spikes: 10,000 orders in a minute can be worked through in ten minutes. Most deliver "at least once", so a job can run twice. Jobs that keep failing go to a dead-letter queue, like a shelf of problem tickets.',

 { id: 'pubsub', t: 'Events and pub/sub', sub: 'Post a notice for everyone', p: 'After each order you personally call the kitchen, then rewards, then SMS. Adding a new team means changing your routine. If SMS does not pick up, you are stuck.',
   i: 'With pub/sub you announce "an order happened" on a board. Any team that cares reads it. You do not need to know who they are.', sim: 'pubsub', try: 'Compare waits with the board off and on. Press <b>SMS team goes on break</b> in both modes.',

   cost: 'It gets harder to trace what happened, since no single place shows the full story.',
   words: [['Event', 'A note that something happened.'], ['Publisher', 'Who announces.'], ['Subscriber', 'Who listens.'], ['Loose coupling', 'Parts know little about each other.']],
   deep: 'A queue gives each job to one worker. Pub/sub gives each event to every interested team. Kafka can do both, and keeps events for days, so a new team can replay old history.',
   quiz: [['With pub/sub, adding a new team:', ['Needs no change to the sender', 'Rewrites the app', 'Stops all orders', 'Is impossible'], 0, 'The new team just starts reading.'], ['A YouTube subscription is like:', ['Pub/sub', 'A cache', 'An index', 'A shard'], 0, 'One publisher, many listeners.']] },
 { id: 'microservices', t: 'Microservices', sub: 'One big app, or many small ones', p: 'One person takes orders, cooks, handles cash and delivers. When that person falls ill, everything stops. A bigger business has separate teams.',
   i: 'A monolith is one big app that does everything. Microservices split it into small apps that talk over the network. Each can change or fail alone.', sim: 'micro', try: 'Press <b>Bug in payment code</b>. Then switch to <b>small services</b> and try it again.',

   cost: 'Calls over a network are slower and can fail. You now run dozens of things. Small teams should start with one app.',
   words: [['Monolith', 'One big app.'], ['Microservice', 'A small app with one job.'], ['Deploy', 'Putting new code live.'], ['Container', 'A packed box holding an app and all it needs. Docker makes these.'], ['Kubernetes', 'Software that manages many containers.']],
   deep: 'Conway\'s Law says systems end up shaped like the teams that build them. Microservices often solve a people problem: 200 engineers cannot safely edit one app. A well-organised monolith is the right start for most new products.',

 { id: 'gateway', t: 'Gatekeeper and rate limits', sub: 'One door, with a guard', p: 'Your shop has many departments and one bad customer keeps placing fake orders, thousands an hour. Honest customers cannot get through.',
   i: 'An API gateway is the single front door. It checks who you are, sends you to the right team, and limits how often you can ask.', sim: 'gate', try: 'Drag spam up to 20. Watch real customers suffer. Then turn on the <b>limit</b>.',

   words: [['API gateway', 'The one front door for all services.'], ['Rate limit', 'A cap on requests per user.'], ['Bot', 'A program pretending to be people.'], ['DDoS', 'A flood of fake traffic meant to take a site down.'], ['HTTP 429', 'The code for "too many requests".']],
   deep: 'The token bucket method gives each user a bucket that fills slowly. Each request takes a token. Empty bucket, no entry. This allows short bursts while capping the average.',
   quiz: [['A rate limit protects you from:', ['Floods of requests', 'Bad design', 'Slow disks', 'Rain'], 0, 'One user cannot take all the capacity.'], ['"Too many OTP attempts" is:', ['Rate limiting', 'Caching', 'Sharding', 'Replication'], 0, 'A cap on tries per user.']] },
]},
{ id: 'storm', name: 'Storm Section', size: 'National brand, nothing may stop', blurb: 'At scale, something is always broken. Good systems expect failure and keep running.', lessons: [
 { id: 'spof', t: 'Single point of failure', sub: 'One key, one lock, one problem', p: 'All 500 outlets order from a single supplier. A truck strike stops that supplier, and all 500 outlets run out of tea on the same day.',
   i: 'A single point of failure is any one part that stops everything when it breaks. The cure is redundancy: keep a spare ready.', sim: 'spof', try: 'Break each part. Then press <b>Add a backup of everything</b> and break them again.',
   real: [['Plane engines', 'Two engines, so one can fail safely.'], ['Inverter at home', 'Backup power during cuts.'], ['Spare tyre', 'A small cost, until the day it saves you.']],
   cost: 'Spares cost money while sitting idle, and switching over must be tested. A backup that was never tried is only a hope.',
   words: [['SPOF', 'Single point of failure.'], ['Redundancy', 'Having spare parts ready.'], ['Uptime', 'Share of time the system works.'], ['99.9%', 'Called three nines: about 8.8 hours down a year.'], ['99.99%', 'Four nines: about 53 minutes down a year.']],
   deep: 'Copies in one building can all fail together. So teams use availability zones (separate buildings in one city) and regions (separate cities). Each extra nine costs far more than the last.',
   quiz: [['Which removes a single point of failure?', ['A ready backup', 'A bigger logo', 'Faster typing', 'A new font'], 0, 'If one fails, the other takes over.'], ['99.9% uptime still means:', ['About 8.8 hours down a year', 'Never down', 'Down every day', 'Down for a month'], 0, '0.1% of 8,760 hours is 8.76 hours.']] },
 { id: 'retries', t: 'Retries and double charges', sub: 'Press Pay only once', p: 'You pay ₹500 and the screen freezes. Did it work? You press Pay again. Now ₹1,000 has gone from your account.',
   i: 'Networks lose messages, so apps retry. To keep retries safe, each action carries a unique ID, and the server ignores repeats. This is called idempotency.', sim: 'retry', try: 'Turn on <b>Retry</b> and watch the double charges. Then turn on the <b>unique payment ID</b>.',
   real: [['Lift button', 'Press it ten times. One lift comes. That is idempotent.'], ['Amazon order', '"You already placed this order" warning.'], ['UPI', 'Each payment has a reference number, so repeats can be spotted.']],
   cost: 'The server must remember IDs, and retries add load. Thousands retrying at once can knock over a system that is just recovering.',
   words: [['Retry', 'Trying again after a failure.'], ['Timeout', 'How long to wait before giving up.'], ['Idempotent', 'Doing it twice has the same effect as once.'], ['Exponential backoff', 'Wait 1 sec, then 2, then 4, and so on.']],
   deep: 'Add backoff with random jitter so that clients do not all retry at the same moment. Remember: a timeout means "I do not know", not "it failed". The payment may have succeeded. That is why IDs are essential.',
   quiz: [['No reply from the bank means:', ['You do not know what happened', 'It definitely failed', 'It definitely worked', 'Your phone is broken'], 0, 'The reply may be what got lost.'], ['Which is idempotent?', ['Setting volume to 10', 'Adding ₹100', 'Sending a message', 'Ordering one more pizza'], 0, 'Setting to 10 twice still gives 10.']] },
 { id: 'breaker', t: 'Circuit breaker', sub: 'Trip the switch before the house burns', p: 'Your SMS partner stops answering. Each order now waits 30 seconds for it. Soon every worker is stuck on hold, and even simple orders freeze.',
   i: 'A circuit breaker notices that a partner keeps failing and stops calling it for a while. You fail fast and protect yourself.', sim: 'breaker', try: 'Press <b>Partner stops answering</b> and watch the app jam. Turn on the <b>Circuit breaker</b>.',
   real: [['Home fuse', 'It cuts power before wires overheat.'], ['Stock market', 'Trading halts when prices fall too fast.'], ['Hotstar', 'Turns off non-essential features during huge load.']],
   cost: 'While tripped, the feature is off. You must decide what to show: a saved answer, or a plain "try later".',
   words: [['Circuit breaker', 'Stops calls to a failing part.'], ['Cascading failure', 'One failure spreading to others.'], ['Fallback', 'A simpler answer when the real one fails.'], ['Graceful degradation', 'Losing small features to save the main one.']],
   deep: 'Breakers have three states. Closed: normal. Open: calls blocked. Half-open: try a few calls to see if the partner recovered. Also use timeouts and bulkheads, which keep separate worker pools so one problem cannot use up all the workers.',
   quiz: [['A circuit breaker protects you from:', ['Failures spreading', 'Bad fonts', 'New users', 'Long passwords'], 0, 'It stops one problem from pulling down all the rest.'], ['In an open state, calls are:', ['Failed fast with no waiting', 'Sent twice', 'Stored forever', 'Sent slowly'], 0, 'No waiting means your workers stay free.']] },
 { id: 'monitor', t: 'Monitoring', sub: 'Know before customers complain', p: 'At 11 am sales drop by half, and you only learn at closing time. A broken stove sat unnoticed all day.',
   i: 'Monitoring means watching live numbers, keeping records, and raising an alarm when something looks wrong.', vis: 'monitor', real: [['Car dashboard', 'Warning lights before the engine dies.'], ['Hospital monitor', 'Beeps as soon as the heart rate changes.'], ['Delivery tracking', 'Shows each step of a package\'s path.']],
   cost: 'Too many alarms and people start ignoring them. Alert only on things that need action.',
   words: [['Metrics', 'Numbers over time.'], ['Logs', 'A diary of events.'], ['Traces', 'The full path of one request.'], ['SLO', 'The target you promise, such as 99.9% in under 1 second.'], ['Alert', 'An automatic call for help.']],
   deep: 'Google\'s four golden signals: latency, traffic, errors and saturation (how full you are). Watch the slow tail too. In the chart above, the average looks fine, but p99 shows some users having a bad time.',

]},
{ id: 'planner', name: 'Planner\'s Cabin', size: 'Think like a system designer', blurb: 'You know the tools. Now learn how designers think: rough numbers, a repeatable method, and honest trade-offs.', lessons: [
 { id: 'estimate', t: 'Rough maths', sub: 'How big is this thing?', p: 'A friend says: "Let\'s build the next big food app." How many servers? How much storage? You cannot plan until you have a rough size.',

   cost: 'Rough numbers can be off by double. That is fine for a first plan. Then test with real load.',

 { id: 'method', t: 'The five-step method', sub: 'From blank page to design', p: 'Someone says: "Design WhatsApp." The blank page is scary. Beginners draw boxes at random. Experienced designers follow the same five steps each time.',

   cost: 'Spend your time on the risky parts. No one can design everything in detail.',

 { id: 'tradeoffs', t: 'Nothing is free', sub: 'Every choice has a price', p: 'Customers want chai that is cheap, delicious and instant. Pick two. Systems have the same rule, and there are no perfect designs.',

   cost: 'Over-building is also a failure. A startup with 100 users does not need Kafka. Build for the next 10× of growth, then redesign.',

]},

function labCost(L) {

}
function labCfg(L) {
  const sids = ['s1', 's2', 's3', 's4', 's5'], nodes = {
    c: { kind: 'client', label: 'Customers', x: 0, y: .5 }, e: { kind: 'cache', label: 'CDN', x: .2, y: .03, ms: 30, workers: 40, queue: 20, hop: 150 }, lb: { kind: 'lb', label: 'Balancer', x: .2, y: .5 },
    k: { kind: 'cache', label: 'Cache', x: .72, y: .03, ms: 25, workers: 30, queue: 20 }, q: { kind: 'queue', label: 'Queue', x: .72, y: .97, ms: 300, workers: 2, queue: 200, ack: true },
    d: { kind: 'db', label: 'Database', x: 1, y: .22, ms: 350, workers: 3, queue: 8 }, r1: { kind: 'db', label: 'Read copy', x: 1, y: .6, ms: 350, workers: 3, queue: 8 }, r2: { kind: 'db', label: 'Read copy', x: 1, y: .97, ms: 350, workers: 3, queue: 8 }
  };
  sids.forEach((id, i) => nodes[id] = { label: 'Server ' + (i + 1), x: .46, y: i / 4, ms: 300, workers: 2, queue: 6 });
  const servers = s => sids.slice(0, L.servers), read = s => leastBusy(s, ['d', 'r1', 'r2'].slice(0, 1 + L.replicas));
  const cfg = {
    key: 'lab', h: 340, nw: 72, nh: 36, hop: 220, okMs: 2500, patience: 6000, nodes, edges: [], rate: 6, data: {},
    tag: s => { const m = s.data.mix || [.4, .5, .1], r = Math.random(); return { t: r < m[0] ? 'img' : r < m[0] + m[1] ? 'read' : 'write' }; },
    route: (p, at, s) => {
      const t = p.tag.t;
      if (at === 'c') { if (t === 'img' && L.cdn) return 'e'; return L.servers > 1 ? 'lb' : 's1'; }
      if (at === 'lb') return leastBusy(s, servers(s));
      if (at === 'e' || at === 'd' || at === 'r1' || at === 'r2') return null;
      if (at === 'k') return p.tag.hit ? null : read(s);
      if (at === 'q') return 'd';
      if (t === 'img') return null;
      if (t === 'read') { if (L.cache) { p.tag.hit = Math.random() < .8; return 'k'; } return read(s); }

function labApply(s, L) {

  n.lb.off = L.servers < 2; n.e.off = !L.cdn; n.k.off = !L.cache; n.q.off = !L.queue; n.r1.off = L.replicas < 1; n.r2.off = L.replicas < 2;
  const e = [['c', L.servers > 1 ? 'lb' : 's1'], ['c', 'e'], ['q', 'd'], ['k', 'd']];
  ['s1', 's2', 's3', 's4', 's5'].forEach(a => { if (L.servers > 1) e.push(['lb', a]); e.push([a, 'k'], [a, 'q'], [a, 'd'], [a, 'r1'], [a, 'r2']); });
  s.edges = e;
}

function lab() {
  const L = { servers: 1, cache: false, replicas: 0, queue: false, cdn: false }; let M = MISSIONS.find(m => !S.miss[m.id]) || MISSIONS[0], run = null;
  app.innerHTML = `<div class="wrap stack" style="padding-block:24px 40px"><div class="board" style="align-self:flex-start"><p class="label">Workshop</p><h1>Build Lab</h1></div>
  <p>Pick a mission, add parts, then run a 15-second test. You pass if under 3% of customers leave, the average wait is under 2.5 sec, and you stay on budget.</p>
  <div class="labgrid"><div class="stack" style="gap:10px"><div id="labsim"></div><div id="verdict" class="verdict" hidden aria-live="polite"></div></div>
  <div class="stack" style="gap:12px"><div class="stack" style="gap:6px" id="missions"></div>
   <div class="stack" style="gap:8px"><p class="label">Your parts</p>
    <div class="ctl" style="grid-template-columns:minmax(0,1fr) auto"><label for="lserv">Servers (₹8,000 each)</label><output id="lservo">1</output><input id="lserv" style="grid-column:1/-1" type="range" min="1" max="5" value="1"></div>
    <div class="ctl" style="grid-template-columns:minmax(0,1fr) auto"><label for="lrep">Read copies (₹10,000 each)</label><output id="lrepo">0</output><input id="lrep" style="grid-column:1/-1" type="range" min="0" max="2" value="0"></div>
    <div class="ctlbtns"><button class="tog" data-p="cache" type="button" aria-pressed="false">Cache ₹5,000</button><button class="tog" data-p="queue" type="button" aria-pressed="false">Queue ₹4,000</button><button class="tog" data-p="cdn" type="button" aria-pressed="false">CDN ₹6,000</button></div>
    <p><b id="lcost"></b></p><button class="btn" id="lrun">Run the 15-second test</button><button class="linkish" id="lhint">Need a hint?</button><p id="lhinttxt" hidden></p></div></div></div></div>`;
  const s = new Sim(labCfg(L), $('#labsim')); sims.push(s); s.mount && 0;
  const mis = () => { $('#missions').innerHTML = '<p class="label">Missions</p>' + MISSIONS.map(m => `<button class="casecard mission ${m === M ? 'on' : ''}" data-m="${m.id}"><span class="pill ${S.miss[m.id] ? 'ok' : ''}">${S.miss[m.id] ? 'PASSED' : '₹' + m.budget.toLocaleString('en-IN') + ' budget'}</span><b>${esc(m.name)}</b><span>${esc(m.text)}</span></button>`).join(''); $$('[data-m]').forEach(b => b.onclick = () => { if (run) return; M = MISSIONS.find(m => m.id === b.dataset.m); mis(); setM(); }); };
  const setM = () => { s.data.mix = M.mix; s.rate = M.rate; $('#lhinttxt').hidden = true; $('#verdict').hidden = true; s.setDown('s1', false); s.data.line = M.text; };
  const up = () => { labApply(s, L); const c = labCost(L); $('#lcost').textContent = `Monthly cost: ₹${c.toLocaleString('en-IN')} of ₹${M.budget.toLocaleString('en-IN')}`; $('#lcost').style.color = c > M.budget ? 'var(--stop)' : 'var(--go)'; };
  $('#lserv').oninput = e => { L.servers = +e.target.value; $('#lservo').textContent = L.servers; up(); };
  $('#lrep').oninput = e => { L.replicas = +e.target.value; $('#lrepo').textContent = L.replicas; up(); };
  $$('[data-p]').forEach(b => b.onclick = () => { L[b.dataset.p] = !L[b.dataset.p]; b.setAttribute('aria-pressed', L[b.dataset.p]); up(); });
  $('#lhint').onclick = () => { const h = $('#lhinttxt'); h.hidden = false; h.textContent = M.hint; };
  $('#lrun').onclick = e => {
    if (run) return; s.playing = true; const pb = $('[data-play]', $('#labsim')); if (pb) pb.textContent = 'Pause';
    s.ps = []; for (const k in s.nodes) { s.nodes[k].q = []; s.nodes[k].busy = 0; s.nodes[k].down = false; } s.log = []; s.total = { ok: 0, lost: 0, ms: 0 }; s.rate = M.rate; s.data.mix = M.mix; $('#verdict').hidden = true;
    const t0 = s.t; run = M; e.target.textContent = 'Testing...';
    const tick = () => {
      if (!sims.includes(s)) return; const el = s.t - t0; s.data.line = `Testing: ${Math.max(0, 15 - el / 1000).toFixed(0)} sec left`;
      if (M.kill && el >= M.kill && !s.n('s1').down && !s.n('s1').off) { s.setDown('s1', true); }
      if (el < 15000) { setTimeout(tick, 200); return; }
      const v = labVerdict(s, M, L), o = $('#verdict'); o.hidden = false; o.className = 'verdict ' + (v.pass ? 'ok' : 'no'); run = null; e.target.textContent = 'Run the 15-second test';
      o.textContent = v.pass ? `Mission passed. ${Math.round(v.lost * 100)}% lost, ${v.wait.toFixed(1)} sec wait, ₹${v.cost.toLocaleString('en-IN')} a month.` : 'Not yet: ' + v.why.join('; ') + '.';
      s.data.line = v.pass ? 'That design holds up.' : 'Change your parts and run the test again.';
      if (v.pass && !S.miss[M.id]) { S.miss[M.id] = 1; S.cups += 20; today(); save(); toast('Mission passed. +20 cups of chai'); } mis();
    }; tick();
  };
  mis(); setM(); up();
}

/* checks every lesson, sim and mission; run from the console */
window.__selftest = () => {
  const bad = [];
  LESSONS.forEach(l => {
    if (!l.sim && !VIS[l.vis]) bad.push('no visual: ' + l.id); if (l.sim && !SIMS[l.sim]) bad.push('no sim: ' + l.id);
    l.quiz.forEach(q => { if (q[2] >= q[1].length) bad.push('quiz: ' + l.id); });
  });
  CASES.forEach(c => { c.steps.forEach(s => s[1].forEach(n => { if (!c.nodes[n]) bad.push('case node ' + c.id + ':' + n); })); c.fixes.forEach(f => { if (!LESSONS.some(l => l.id === f[2])) bad.push('case link ' + f[2]); }); });
  FIXES.forEach(f => f[1].forEach(id => { if (!LESSONS.some(l => l.id === id)) bad.push('fix link ' + id); }));
  for (const k in SIMS) {
    try {
      const c = SIMS[k](), s = new Sim(c); for (let t = 0; t < 12000; t += 16) s.step(16);
      (c.controls || []).forEach(x => { if (x.k === 'toggle') x.set(s, true); if (x.k === 'btn') x.do(s); });
      for (let t = 0; t < 12000; t += 16) s.step(16);
      if (!s.total.ok && k !== 'x') bad.push('sim served nothing: ' + k);
    } catch (e) { bad.push('sim ' + k + ': ' + e.message); }
  }
  const missions = MISSIONS.map(m => { const base = { servers: 1, cache: false, replicas: 0, queue: false, cdn: false }, a = labHeadless(m, { ...base, ...m.pass }), b = labHeadless(m, base); return { id: m.id, pass: a.pass, why: a.why, lost: +a.lost.toFixed(3), wait: +a.wait.toFixed(2), baseFails: !b.pass }; });
  return { lessons: LESSONS.length, cases: CASES.length, words: WORDS.length, bad, missions };
};

    else if (S.cups) save();
  } catch (e) {}
})();
